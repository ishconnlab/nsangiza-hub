    <title>Nsangiza Hub | Your Safe Space to Talk</title>
    <style>
      #nsz-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        gap: 0;
        background: radial-gradient(120% 120% at 50% 0%, #f0f7f2 0%, #f8faf8 55%, #f8faf8 100%);
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.35s ease;
      }
      #nsz-boot.nsz-hide {
        opacity: 0;
        pointer-events: none;
      }
      .nsz-boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .nsz-mark {
        width: 76px;
        height: 76px;
        border-radius: 19px;
        box-shadow: 0 14px 34px rgba(47, 107, 79, 0.22);
        animation: nsz-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .nsz-word {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #2f6b4f;
      }
      .nsz-word span {
        color: #17211b;
      }
      .nsz-bar {
        width: 132px;
        height: 5px;
        border-radius: 999px;
        background: #e3efe7;
        overflow: hidden;
      }
      .nsz-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #6fa57f, #2f6b4f);
        animation: nsz-slide 1.1s ease-in-out infinite;
      }
      @keyframes nsz-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(340%); }
      }
      @keyframes nsz-pop {
        0% { transform: scale(0.82); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .nsz-mark, .nsz-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="nsz-boot" role="status" aria-live="polite" aria-label="Loading Nsangiza Hub">
      <div class="nsz-boot-inner">
        <svg class="nsz-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="nsz-boot-g" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
              <stop stop-color="#3E8F66" />
              <stop offset="1" stop-color="#214B38" />
            </linearGradient>
          </defs>
          <rect width="48" height="48" rx="12" fill="url(#nsz-boot-g)" />
          <path fill="#DCEFE3" d="M24 12.8C22.3 10.4 19.8 10 16.3 10 11.2 10 7 13.9 7 19.4c0 6.2 6.6 11.8 17 19.1Z" />
          <path fill="#FFFFFF" d="M24 12.8C25.7 10.4 28.2 10 31.7 10 36.8 10 41 13.9 41 19.4c0 6.2-6.6 11.8-17 19.1Z" />
        </svg>
        <div class="nsz-word">Nsangiza <span>Hub</span></div>
        <div class="nsz-bar" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>Nsangiza Hub needs JavaScript to keep your experience safe and private. Please enable it to continue.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>

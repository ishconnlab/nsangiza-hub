<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F6B4F" />
    <title>You are offline — Nsangiza Hub</title>
    <style>
      body { font-family: -apple-system, 'Segoe UI', Inter, Roboto, sans-serif; background: #F8FAF8; color: #17211B; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      .card { text-align: center; padding: 40px; background: #fff; border-radius: 20px; box-shadow: 0 12px 32px rgba(47, 107, 79, 0.08); max-width: 420px; }
      h1 { color: #2F6B4F; margin: 0 0 8px; }
      p { color: #66736B; margin: 0 0 24px; }
      button { background: #2F6B4F; color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>Check your connection and try again. Your private information is never stored on this device.</p>
      <button onclick="window.location.reload()">Retry connection</button>
    </div>
  </body>
</html>
